[package]
name = "minka-thermal"
version = "0.1.0"
edition = "2024"
description = "MinkaThermal: a cooling watch that warns when the laptop needs cleaning and checks that a clean worked"
license = "MIT"

# The library holds every module so that tests/seed.rs and tests/rules.rs can drive episodes and
# rules directly. MinkaDE's one binary (minka/, at the top of the checkout) runs its `main` as
# `minka-thermal`; nothing is built from here alone.
[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
# MinkaDE's log line (minka-note/, at the top of the checkout): one write(2) each.
minka-note = { path = "../minka-note" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
